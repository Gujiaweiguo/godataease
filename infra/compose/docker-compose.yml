services:
  godataease-app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: godataease:latest
    container_name: godataease-app
    restart: "no"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DATABASE_HOST: mysql8
      DATABASE_PORT: ${DB_PORT:-3306}
      DATABASE_NAME: ${DB_NAME:-dataease_dev}
      DATABASE_USER: ${DB_USER:-root}
      DATABASE_PASSWORD: ${DB_PASSWORD:-Admin168}
      REDIS_HOST: godataease-redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CALCITE_GRPC_ADDR: ${CALCITE_GRPC_ADDR:-}
      CALCITE_GRPC_TIMEOUT_SEC: ${CALCITE_GRPC_TIMEOUT_SEC:-10}
      CALCITE_GRPC_MAX_RETRIES: ${CALCITE_GRPC_MAX_RETRIES:-1}
      SEATUNNEL_GRPC_ADDR: ${SEATUNNEL_GRPC_ADDR:-}
      SEATUNNEL_GRPC_TIMEOUT_SEC: ${SEATUNNEL_GRPC_TIMEOUT_SEC:-15}
      SEATUNNEL_GRPC_MAX_RETRIES: ${SEATUNNEL_GRPC_MAX_RETRIES:-1}
      CONFIG_PATH: /opt/module/dataease2.0/configs
    depends_on:
      godataease-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - my-net
    volumes:
      - dataease-data:/opt/module/dataease2.0/data
      - dataease-logs:/opt/module/dataease2.0/logs

  godataease-redis:
    image: redis:7-alpine
    container_name: godataease-redis
    restart: "no"
    ports:
      - "${REDIS_EXTERNAL_PORT:-16379}:6379"
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --requirepass "$$REDIS_PASSWORD"; else exec redis-server; fi'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - my-net
    volumes:
      - redis-data:/data

networks:
  my-net:
    external: true

volumes:
  dataease-data:
  dataease-logs:
  redis-data:
