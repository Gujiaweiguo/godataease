# DataEase 开发环境配置
# 用法：docker compose -f infra/compose/docker-compose.dev.yml --env-file infra/compose/.env.dev up -d
# 说明：仅启动 Redis，MySQL 共用 my-net 中的 mysql8 容器，前后端在宿主机本地运行

services:
  godataease-redis:
    image: redis:7-alpine
    container_name: godataease-redis
    restart: "no"
    # Avoid depending on the image default docker-entrypoint.sh permissions in local dev environments.
    entrypoint: ["redis-server"]
    ports:
      - "${REDIS_EXTERNAL_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - my-net
    volumes:
      - redis-dev-data:/data

networks:
  my-net:
    external: true

volumes:
  redis-dev-data:
