# Development override: mount local build artifacts for fast iteration.
# Usage: docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.dev.yml up -d
# Prereqs: make build-static (backend), npm run build:base (frontend)

services:
  godataease-app:
    image: godataease:latest
    volumes:
      - ../../apps/frontend/dist:/opt/module/dataease2.0/frontend:ro
      - ../../apps/backend-go/dataease-backend:/opt/module/dataease2.0/dataease-backend:ro
      - dataease-data:/opt/module/dataease2.0/data
      - dataease-logs:/opt/module/dataease2.0/logs
    environment:
      GIN_MODE: debug
    healthcheck:
      start_period: 60s
