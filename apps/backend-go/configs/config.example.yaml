server:
  port: 8100
  mode: debug

database:
  host: ${DATABASE_HOST:-mysql8}
  port: ${DATABASE_PORT:-3306}
  name: ${DATABASE_NAME:-dataease_dev}
  user: ${DATABASE_USER:-root}
  password: ${DATABASE_PASSWORD:-change-me}
  max_open_conns: 100
  max_idle_conns: 10

redis:
  host: ${REDIS_HOST:-redis-dataease}
  port: ${REDIS_PORT:-6379}
  password: ${REDIS_PASSWORD:-}
  db: 0
  pool_size: 100

jwt:
  secret: ${JWT_SECRET:-change-me-in-production}
  expire: 86400

log:
  level: info
  format: console

telemetry:
  enabled: false
  endpoint: ""
