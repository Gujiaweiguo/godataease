server:
  port: 8100
  mode: debug

database:
  host: ${DATABASE_HOST:-mysql8}
  port: ${DATABASE_PORT:-3306}
  name: ${DATABASE_NAME:-dataease_dev}
  user: ${DATABASE_USER:-root}
  password: ${DATABASE_PASSWORD:-change-me}
  max_open_conns: 100
  max_idle_conns: 10

redis:
  host: ${REDIS_HOST:-godataease-redis}
  port: ${REDIS_PORT:-6379}
  password: ${REDIS_PASSWORD:-}
  db: 0
  pool_size: 100

rate_limit:
  enabled: false
  default_max_requests: 100
  default_window_seconds: 60
  use_redis: true
  # route_overrides:
  #   login:
  #     max_requests: 10
  #     window_seconds: 60
  #   datasource-validate:
  #     max_requests: 30
  #     window_seconds: 60
  #   audit-export:
  #     max_requests: 10
  #     window_seconds: 60

scheduler:
  sample_job_enabled: false

jwt:
  secret: ${JWT_SECRET:-change-me-in-production}
  expire: 86400

log:
  level: info
  format: console

telemetry:
  enabled: false
  endpoint: ""

integration:
  calcite:
    address: ${CALCITE_GRPC_ADDR:-}
    timeout_sec: ${CALCITE_GRPC_TIMEOUT_SEC:-10}
    max_retries: ${CALCITE_GRPC_MAX_RETRIES:-1}
  seatunnel:
    address: ${SEATUNNEL_GRPC_ADDR:-}
    timeout_sec: ${SEATUNNEL_GRPC_TIMEOUT_SEC:-15}
    max_retries: ${SEATUNNEL_GRPC_MAX_RETRIES:-1}

menu:
  hardcoded_fallback: false
