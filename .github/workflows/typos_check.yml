name: Typos Check

on:
  push:
    paths:
      - 'apps/**'
      - 'infra/**'
      - 'docs/**'
      - 'openspec/**'
      - 'scripts/**'
      - '.github/**'
      - '*.md'
      - '*.txt'
      - '*.yml'
      - '*.yaml'
  pull_request:
    paths:
      - 'apps/**'
      - 'infra/**'
      - 'docs/**'
      - 'openspec/**'
      - 'scripts/**'
      - '.github/**'
      - '*.md'
      - '*.txt'
      - '*.yml'
      - '*.yaml'

jobs:
  run:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Actions Repository
      uses: actions/checkout@v4

    - name: Check spelling
      uses: crate-ci/typos@master
      with:
        config: .github/typos.toml
