name: Frontend CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/frontend/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/frontend/**'
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run E2E tests (requires backend service)'
        required: false
        default: false
        type: boolean
      run_system_smoke:
        description: 'Run non-blocking system smoke tests'
        required: false
        default: false
        type: boolean

jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Detect changed areas
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            embedding:
              - 'apps/frontend/src/events/embedding/**'
              - 'apps/frontend/src/hooks/event/**'
              - 'apps/frontend/src/store/modules/embedded.ts'
              - 'apps/frontend/src/services/TokenManager.ts'
              - 'apps/frontend/src/utils/embedded*.ts'
              - 'apps/frontend/tests/unit/events/**'
              - 'apps/frontend/tests/integration/parent-child-communication.test.ts'
              - 'apps/frontend/src/tests/unit/services/TokenManager.test.ts'
              - 'apps/frontend/src/tests/unit/utils/embedding-utils.test.ts'
            datasource:
              - 'apps/frontend/src/views/visualized/data/datasource/**'
              - 'apps/frontend/src/api/datasource.ts'
              - 'apps/frontend/src/store/modules/interactive.ts'
              - 'apps/frontend/tests/unit/datasource/**'
            shared:
              - 'apps/frontend/src/config/axios/**'
              - 'apps/frontend/src/store/**'
              - 'apps/frontend/src/utils/**'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        id: tscheck
        run: npm run ts:check
      - name: ESLint
        id: lint
        run: npm run lint

      - name: Build
        id: build
        run: npm run build:base

      - name: Test
        id: test
        run: npm run test:core
      - name: Select affected test target
        id: affected
        run: |
          if [[ "${{ steps.changes.outputs.embedding }}" == "true" && "${{ steps.changes.outputs.datasource }}" == "true" ]]; then
            echo "target=test:core" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.changes.outputs.embedding }}" == "true" ]]; then
            echo "target=test:affected:embedding" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.changes.outputs.datasource }}" == "true" ]]; then
            echo "target=test:affected:datasource" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.changes.outputs.shared }}" == "true" ]]; then
            echo "target=test:core" >> $GITHUB_OUTPUT
          else
            echo "target=none" >> $GITHUB_OUTPUT
          fi

      - name: Affected Test Matrix
        id: testcore
        if: steps.affected.outputs.target != 'none'
        run: npm run ${{ steps.affected.outputs.target }}

      - name: Datasource benchmark
        id: bench
        if: steps.changes.outputs.datasource == 'true' || steps.changes.outputs.shared == 'true'
        run: |
          mkdir -p benchmark-results
          set -o pipefail
          BENCH_OUTPUT_JSON=benchmark-results/datasource-tree-current.json npm run bench:datasource-tree | tee benchmark-results/datasource-tree-benchmark.txt

      - name: Datasource benchmark compare
        id: bench_compare
        if: steps.changes.outputs.datasource == 'true' || steps.changes.outputs.shared == 'true'
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            node scripts/benchmark-compare.cjs \
              --baseline tests/perf/baseline/datasource-tree-baseline.json \
              --current benchmark-results/datasource-tree-current.json \
              --output benchmark-results/datasource-tree-compare.md \
              --json-output benchmark-results/datasource-tree-compare.json \
              --threshold=10 \
              --ignore-below-ms=0.5 \
              --fail-on-regression=true
          else
            node scripts/benchmark-compare.cjs \
              --baseline tests/perf/baseline/datasource-tree-baseline.json \
              --current benchmark-results/datasource-tree-current.json \
              --output benchmark-results/datasource-tree-compare.md \
              --json-output benchmark-results/datasource-tree-compare.json \
              --threshold=10 \
              --ignore-below-ms=0.5
          fi

      - name: Upload datasource benchmark artifact
        if: always() && (steps.changes.outputs.datasource == 'true' || steps.changes.outputs.shared == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: datasource-tree-benchmark-${{ github.run_id }}
          path: |
            apps/frontend/benchmark-results/datasource-tree-benchmark.txt
            apps/frontend/benchmark-results/datasource-tree-current.json
            apps/frontend/benchmark-results/datasource-tree-compare.md
            apps/frontend/benchmark-results/datasource-tree-compare.json
          retention-days: 14

      - name: Summary
        if: always()
        run: npm run quality:report:summary -- --ts=${{ steps.tscheck.outcome }} --lint=${{ steps.lint.outcome }} --build=${{ steps.build.outcome }} --test-core=${{ steps.test.outcome }} --affected-target=${{ steps.affected.outputs.target }} --affected=${{ steps.testcore.outcome }} --bench=${{ steps.bench.outcome }} --bench-compare=${{ steps.bench_compare.outcome }}

  # E2E tests job - requires backend service
  # Run manually via workflow_dispatch with run_e2e=true
  # Or automatically when backend is available in CI environment
  e2e:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event.inputs.run_e2e == 'true'
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        id: e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'http://localhost:8080' }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME || 'admin' }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npm run e2e -- --reporter=list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7

  system_smoke:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_system_smoke == 'true')
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check smoke test prerequisites
        id: smoke_prereq
        env:
          E2E_BASE_URL_SECRET: ${{ secrets.E2E_BASE_URL }}
          E2E_PASSWORD_SECRET: ${{ secrets.E2E_PASSWORD }}
        run: |
          if [ -z "$E2E_BASE_URL_SECRET" ] || [ -z "$E2E_PASSWORD_SECRET" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "## System Smoke" >> "$GITHUB_STEP_SUMMARY"
            echo "Skipped: missing E2E_BASE_URL or E2E_PASSWORD secret." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run system smoke tests
        if: steps.smoke_prereq.outputs.run == 'true'
        id: smoke
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME || 'admin' }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          mkdir -p test-results/system-smoke
          PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/system-smoke/results.json npm run e2e:system-smoke -- --reporter=list,json

      - name: Collect system smoke stats
        if: always() && steps.smoke_prereq.outputs.run == 'true'
        id: smoke_stats
        run: |
          node <<'EOF'
          const fs = require('fs')
          const reportPath = 'test-results/system-smoke/results.json'
          const outFile = process.env.GITHUB_OUTPUT
          if (!fs.existsSync(reportPath)) {
            fs.appendFileSync(outFile, 'has_stats=false\n')
            process.exit(0)
          }
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'))
          const stats = report.stats || {}
          const passed = Number(stats.expected ?? 0)
          const failed = Number(stats.unexpected ?? 0)
          const skipped = Number(stats.skipped ?? 0)
          const flaky = Number(stats.flaky ?? 0)
          const total = passed + failed + skipped + flaky
          fs.appendFileSync(outFile, 'has_stats=true\n')
          fs.appendFileSync(outFile, `total=${total}\n`)
          fs.appendFileSync(outFile, `passed=${passed}\n`)
          fs.appendFileSync(outFile, `failed=${failed}\n`)
          fs.appendFileSync(outFile, `skipped=${skipped}\n`)
          fs.appendFileSync(outFile, `flaky=${flaky}\n`)
          EOF

      - name: Upload system smoke report
        if: always() && steps.smoke_prereq.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-system-smoke-report
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/system-smoke/results.json
          if-no-files-found: warn
          retention-days: 7

      - name: System smoke summary
        if: always()
        run: |
          echo "## Frontend System Smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | Result | Total | Passed | Failed | Skipped | Flaky |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.smoke_prereq.outputs.run }}" != "true" ]; then
            echo "| ${{ github.event_name }} | skipped (missing secrets) | - | - | - | - | - |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.smoke_stats.outputs.has_stats }}" != "true" ]; then
            echo "| ${{ github.event_name }} | ${{ steps.smoke.outcome }} | - | - | - | - | - |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| ${{ github.event_name }} | ${{ steps.smoke.outcome }} | ${{ steps.smoke_stats.outputs.total }} | ${{ steps.smoke_stats.outputs.passed }} | ${{ steps.smoke_stats.outputs.failed }} | ${{ steps.smoke_stats.outputs.skipped }} | ${{ steps.smoke_stats.outputs.flaky }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify Slack on system smoke failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.FRONTEND_SYSTEM_SMOKE_SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "FRONTEND_SYSTEM_SMOKE_SLACK_WEBHOOK_URL is not configured, skip Slack notify"
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="[frontend-system-smoke] FAILED on ${{ github.ref_name }}. Run: ${RUN_URL}"
          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"${MESSAGE}\"}" || true

      - name: Notify WeCom on system smoke failure
        if: failure()
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.FRONTEND_SYSTEM_SMOKE_WECOM_WEBHOOK_URL }}
        run: |
          if [ -z "$WECOM_WEBHOOK_URL" ]; then
            echo "FRONTEND_SYSTEM_SMOKE_WECOM_WEBHOOK_URL is not configured, skip WeCom notify"
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="[frontend-system-smoke] FAILED on ${{ github.ref_name }}. Run: ${RUN_URL}"
          curl -sS -X POST "$WECOM_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"${MESSAGE}\"}}" || true
