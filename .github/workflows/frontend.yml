name: Frontend CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/frontend/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/frontend/**'

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        id: tscheck
        continue-on-error: true
        run: npm run ts:check

      - name: ESLint
        id: lint
        run: npm run lint

      - name: Build
        id: build
        run: npm run build:base

      - name: Test
        id: test
        run: npm run test:ci

      - name: Summary
        if: always()
        run: |
          echo "## Frontend CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript: ${{ steps.tscheck.outcome }} (non-blocking)" >> $GITHUB_STEP_SUMMARY
          echo "- ESLint: ${{ steps.lint.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ steps.build.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ steps.test.outcome }}" >> $GITHUB_STEP_SUMMARY
