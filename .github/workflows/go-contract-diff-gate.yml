name: Go Contract Diff Gate

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run in dry-run mode (continue-on-error enabled)'
        required: false
        default: 'false'
        type: boolean
      baseline-url:
        description: 'Baseline backend URL'
        required: false
        default: ''
        type: string
      candidate-url:
        description: 'Candidate backend URL'
        required: false
        default: ''
        type: string

env:
  BASELINE_URL: ${{ github.event.inputs.baseline-url || secrets.CONTRACT_DIFF_BASELINE_URL || 'http://localhost:8081' }}
  CANDIDATE_URL: ${{ github.event.inputs.candidate-url || secrets.CONTRACT_DIFF_CANDIDATE_URL || 'http://localhost:8082' }}

jobs:
  contract-diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-go
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Detect backend-go changes
      id: changes
      uses: dorny/paths-filter@v3
      with:
        filters: |
          backend:
            - 'apps/backend-go/**'

    - name: Install contract diff dependencies
      if: steps.changes.outputs.backend == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y jq python3 python3-pip
        python3 -m pip install --user pyyaml

    - name: Run compatibility status drift check
      if: steps.changes.outputs.backend == 'true'
      run: make drift-check

    - name: Run contract diff (external or mock fallback)
      id: contract-diff-run
      if: steps.changes.outputs.backend == 'true'
      run: |
        is_healthy() {
          local base_url="$1"
          curl -s --connect-timeout 5 --max-time 10 "${base_url}/health" >/dev/null 2>&1
        }

        RESOLVED_BASELINE_URL="${BASELINE_URL}"
        RESOLVED_CANDIDATE_URL="${CANDIDATE_URL}"
        MODE="external"

        if ! is_healthy "${BASELINE_URL}" || ! is_healthy "${CANDIDATE_URL}"; then
          MODE="mock"
          RESOLVED_BASELINE_URL="http://127.0.0.1:18081"
          RESOLVED_CANDIDATE_URL="http://127.0.0.1:18082"

        cat > /tmp/contract_diff_mock_server.py <<'PY'
        from http.server import BaseHTTPRequestHandler, HTTPServer
        import json
        import sys

        class Handler(BaseHTTPRequestHandler):
            def _write_json(self, payload, status=200):
                raw = json.dumps(payload).encode("utf-8")
                self.send_response(status)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(raw)))
                self.end_headers()
                self.wfile.write(raw)

            def _handle(self, method):
                if self.path == "/health":
                    self._write_json({"status": "ok"})
                    return
                self._write_json({
                    "code": "000000",
                    "msg": "success",
                    "data": {
                        "path": self.path,
                        "method": method
                    }
                })

            def do_GET(self):
                self._handle("GET")

            def do_POST(self):
                _ = self.rfile.read(int(self.headers.get("Content-Length", "0")))
                self._handle("POST")

            def log_message(self, format, *args):
                return

        if __name__ == "__main__":
            port = int(sys.argv[1])
            HTTPServer(("127.0.0.1", port), Handler).serve_forever()
        PY

          nohup python3 /tmp/contract_diff_mock_server.py 18081 >/tmp/contract-diff-java-mock.log 2>&1 &
          nohup python3 /tmp/contract_diff_mock_server.py 18082 >/tmp/contract-diff-go-mock.log 2>&1 &
          sleep 1
        fi

        echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
        echo "resolved_baseline=${RESOLVED_BASELINE_URL}" >> "$GITHUB_OUTPUT"
        echo "resolved_candidate=${RESOLVED_CANDIDATE_URL}" >> "$GITHUB_OUTPUT"

        chmod +x scripts/contract-diff/run_contract_diff.sh
        scripts/contract-diff/run_contract_diff.sh \
          --java-base "${RESOLVED_BASELINE_URL}" \
          --go-base "${RESOLVED_CANDIDATE_URL}" \
          --out-dir reports \
          --whitelist testdata/contract-diff/critical-whitelist.yaml
      env:
        BASELINE_URL: ${{ env.BASELINE_URL }}
        CANDIDATE_URL: ${{ env.CANDIDATE_URL }}

    - name: Upload JSON report
      uses: actions/upload-artifact@v4
      if: always() && steps.changes.outputs.backend == 'true'
      with:
        name: contract-diff-json
        path: apps/backend-go/reports/contract-diff.json
        retention-days: 30

    - name: Upload Markdown report
      uses: actions/upload-artifact@v4
      if: always() && steps.changes.outputs.backend == 'true'
      with:
        name: contract-diff-md
        path: apps/backend-go/reports/contract-diff.md
        retention-days: 30

    - name: Summary
      if: always()
      run: |
        echo "## Contract Diff Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.changes.outputs.backend }}" != "true" ]; then
          echo "⏭️ No backend-go changes detected; contract diff skipped intentionally." >> $GITHUB_STEP_SUMMARY
        elif [ -f reports/contract-diff.md ]; then
          echo "Run mode: ${{ steps.contract-diff-run.outputs.mode }}" >> $GITHUB_STEP_SUMMARY
          echo "Baseline: \`${{ steps.contract-diff-run.outputs.resolved_baseline }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Candidate: \`${{ steps.contract-diff-run.outputs.resolved_candidate }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat reports/contract-diff.md >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ No report generated." >> $GITHUB_STEP_SUMMARY
        fi
      env:
        BASELINE_URL: ${{ env.BASELINE_URL }}
        CANDIDATE_URL: ${{ env.CANDIDATE_URL }}
