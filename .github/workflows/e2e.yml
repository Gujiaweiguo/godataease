name: E2E Tests

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      baseline-url:
        description: 'Base URL for E2E tests'
        required: false
        default: ''
        type: string
      ref:
        description: 'Git ref to checkout (branch/tag/sha)'
        required: false
        default: ''
        type: string

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build:base

      - name: Start frontend preview
        run: npm run preview -- --host 0.0.0.0 --port 8080 &

      - name: Wait for services
        run: |
          npx wait-on http://localhost:8080 -t 60000
          sleep 5

      - name: Run E2E tests
        run: npm run e2e -- --grep-invert "@system-smoke"
        env:
          E2E_BASE_URL: ${{ github.event.inputs.baseline-url || 'http://localhost:8080' }}
          E2E_USERNAME: admin
          E2E_PASSWORD: DataEase123456

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: apps/frontend/test-results/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## E2E Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f playwright-report/results.json ]; then
            echo "Test results available in artifacts." >> $GITHUB_STEP_SUMMARY
          else
            echo "No test results generated." >> $GITHUB_STEP_SUMMARY
          fi
