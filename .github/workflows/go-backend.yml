name: Go Backend CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-go

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Admin168
          MYSQL_DATABASE: dataease_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4

      id: changes
      uses: dorny/paths-filter@v3
      with:
        filters: |
          backend:
            - 'apps/backend-go/**'

    - name: Set up Go
      if: steps.changes.outputs.backend == 'true'
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install dependencies
      if: steps.changes.outputs.backend == 'true'
      run: go mod tidy

    - name: Set up Buf
      if: steps.changes.outputs.backend == 'true'
      uses: bufbuild/buf-setup-action@v1

    - name: Install protobuf generators
      if: steps.changes.outputs.backend == 'true'
      run: |
        go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.1
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Lint protobuf definitions
      if: steps.changes.outputs.backend == 'true'
      run: buf lint

    - name: Verify protobuf generated code is up to date
      if: steps.changes.outputs.backend == 'true'
      run: |
        export PATH="$(go env GOPATH)/bin:$PATH"
        buf generate
        git diff --exit-code -- proto/

    - name: Build
      if: steps.changes.outputs.backend == 'true'
      run: make build

    - name: Run tests
      if: steps.changes.outputs.backend == 'true'
      run: make test

    - name: Run integration tests
      if: steps.changes.outputs.backend == 'true'
      env:
        TEST_DB_HOST: 127.0.0.1
        TEST_DB_PORT: 3306
        TEST_DB_USER: root
        TEST_DB_PASSWORD: Admin168
        TEST_DB_NAME: dataease_test
      run: make test-integration

    - name: Run linter
      if: steps.changes.outputs.backend == 'true'
      uses: golangci/golangci-lint-action@v4
      with:
        working-directory: apps/backend-go

    - name: Summary
      if: always()
      run: |
        echo "## Go Backend CI" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.changes.outputs.backend }}" = "true" ]; then
          echo "- Unit tests: completed" >> $GITHUB_STEP_SUMMARY
          echo "- Integration tests: completed" >> $GITHUB_STEP_SUMMARY
          echo "Full backend CI executed." >> $GITHUB_STEP_SUMMARY
        else
          echo "No backend-go changes detected, backend CI skipped intentionally." >> $GITHUB_STEP_SUMMARY
        fi
